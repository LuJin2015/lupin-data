name: Lupin Airlines Cloud Data

on:
  workflow_dispatch:
    inputs:
      operation:
        required: true
        type: string
      payload:
        required: true
        type: string

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply request
        env:
          OPERATION: ${{ inputs.operation }}
          PAYLOAD: ${{ inputs.payload }}
        run: python .github/scripts/apply-lupin-data.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lupin-airlines/
          git commit -m "Update Lupin Airlines cloud data" || exit 0
          git push
